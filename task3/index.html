<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo-list — Лабораторная работа №3</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="wrap">
    <h1>Список задач</h1>

    <div class="input-row">
      <input type="text" id="taskInput" placeholder="Новая задача…" autocomplete="off">
      <button id="addBtn">Добавить</button>
    </div>
    <div class="warning" id="warning">

    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">Все</button>
      <button class="filter-btn" data-filter="active">Активные</button>
      <button class="filter-btn" data-filter="completed">Завершённые</button>
    </div>

    <ul class="task-list" id="taskList"></ul>

    <div class="stats" id="stats"></div>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
